<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Arkham Exchange Flow Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-dot"></span> Exchange Flow Monitor
      </a>
      <nav class="nav">
        <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">Dashboard</a>
        <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">Cài đặt</a>
      </nav>
      <div class="status-pill" id="conn-status">
        <span class="dot dot-pending"></span> Đang kết nối...
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Dữ liệu từ Arkham Intelligence API · Chỉ mang tính tham khảo, không phải lời khuyên tài chính
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
